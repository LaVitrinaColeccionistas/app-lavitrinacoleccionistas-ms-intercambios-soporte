spring:
  application:
    name: ${APP_NAME:app-lavitrina-ms-intercambios-soporte}

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}

  data:
    web:
      pageable:
        default-page-size: ${PAGE_DEFAULT_SIZE:20}
        max-page-size: ${PAGE_MAX_SIZE:100}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:/api}