
spring:
  application:
    name: ${APP_NAME:app-lavitrinacoleccionistas-ms-intercambios-soporte}

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}

  liquibase:
    enabled: ${LIQUIBASE_ENABLED:false}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}

  data:
    web:
      pageable:
        default-page-size: ${PAGE_DEFAULT_SIZE:20}
        max-page-size: ${PAGE_MAX_SIZE:100}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: ${REDIS_TIMEOUT:10000ms}

  cache:
    type: redis

app:
  pagination:
    sort-field: ${PAGE_SORT_FIELD:id}
    sort-direction: ${PAGE_SORT_DIRECTION:DESC}

  cache:
    prefix: ${CACHE_PREFIX:lvc-intercambios}
    default-ttl: ${CACHE_DEFAULT_TTL:10m}
    domains:
      intercambios: ${CACHE_TTL_INTERCAMBIOS:5m}
      tickets: ${CACHE_TTL_TICKETS:5m}

  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:lvc-auth}

server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework
  servlet:
    context-path: ${CONTEXT_PATH:/api}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}